bilterm_target_files = ["src/vt/mod.rs"]
target_milestone = "v0.2.0"
priority = "high"
effort = "small"
summary = "Respond to ANSI/DEC mode queries (CSI ? Pd $ p) with CSI ? Pd ; Ps $ y so Neovim, Helix, and Fish detect ?2026, ?2027, and ?2004 support."

[[features]]
id = "FND-04"
tier = "tier_1_foundational"
direction = "ghostty_to_bilterm"
subsystem = "input_protocol"
title = "Kitty Keyboard Protocol (CSI > flags u / CSI ? u)"
