# Bilterm Machine-Readable Feature Map & Roadmap
# Generated from direct source inspection of ghostty-org/ghostty (.tmp/ghostty/src/)
# and cross-ecosystem terminal analysis (WezTerm, Kitty, Alacritty, Zellij, Foot, Warp, Contour, xterm, DEC VT520, IBM 3270).

[metadata]
project = "bilterm"
current_version = "0.2.5"
reference_repos = ["https://github.com/ghostty-org/ghostty", "https://github.com/uzaaft/libghostty-rs"]
ecosystem_references = ["wezterm", "kitty", "alacritty", "zellij", "foot", "warp", "contour", "xterm", "ibm-3270", "dec-vt520", "gpui", "egui"]

# ==============================================================================
# TIER 0: OPTIMAL TECH STACK BLUEPRINT (v0.2.5 — IMPLEMENTED)
# ==============================================================================

[[features]]
id = "ARCH-01"
tier = "tier_0_blueprint"
direction = "ghostty_to_bilterm"
subsystem = "vt_snapshot"
title = "Renderer-Agnostic GridSnapshot & CellSnapshot Seam"
ghostty_ref = "include/ghostty/vt.h (RenderState)"
bilterm_target_files = ["src/vt/snapshot.rs", "src/vt/mod.rs"]
target_milestone = "implemented_v0.2.5"
priority = "completed"
effort = "medium"
summary = "Point-in-time GridSnapshot, RowSnapshot, CellSnapshot, and CursorSnapshot decoupling the UI layer from the underlying VT parser."

[[features]]
id = "ARCH-02"
tier = "tier_0_blueprint"
direction = "ghostty_to_bilterm"
subsystem = "vt_worker"
title = "Dedicated Emulation Worker Thread Loop (portable-pty -> libghostty-vt / VtParser -> SharedGridSnapshot)"
ghostty_ref = "libghostty-vt (!Send/!Sync worker thread pattern)"
bilterm_target_files = ["src/vt/worker.rs", "src/vt/ghostty_backend.rs"]
target_milestone = "implemented_v0.2.5"
priority = "completed"
effort = "medium"
summary = "Dedicated OS worker thread continuously reading raw bytes from portable-pty, feeding libghostty-vt / VtParser, replying to terminal queries on-thread, and publishing atomic SharedGridSnapshot frames."

[[features]]
id = "ARCH-03"
tier = "tier_0_blueprint"
direction = "ecosystem_to_bilterm"
subsystem = "ui_rendering"
title = "Abstract UI & Window Layer Seam (Ratatui TUI + GPUI / egui Native GPU Readiness)"
ghostty_ref = "GPUI / winit + egui RenderState consumers"
bilterm_target_files = ["src/ui/renderer.rs", "src/ui/mod.rs"]
target_milestone = "implemented_v0.2.5"
priority = "completed"
effort = "medium"
summary = "WorkspaceFrameSnapshot and WorkspaceFrameRenderer trait allowing Ratatui, GPUI, or egui to render the multi-pane workspace from pure point-in-time snapshots."

# ==============================================================================
# TIER 1: CORE, FOUNDATIONAL TERMINAL FEATURES
# ==============================================================================

[[features]]
id = "FND-01"
tier = "tier_1_foundational"
direction = "ghostty_to_bilterm"
subsystem = "input_security"
title = "Paste Injection Sanitization & Unsafe Multi-Line Paste Guard"
ghostty_ref = "src/input/paste.zig, src/terminal/paste.zig"
bilterm_target_files = ["src/input/mod.rs", "src/vt/mod.rs", "src/ui/mod.rs"]
target_milestone = "v0.2.0"
priority = "high"
effort = "small"
summary = "Strip control bytes (NUL, ESC, DEL, VINTR 0x03, VQUIT, VSUSP) from pastes and prompt before unbracketed multi-line paste in RAW PTY mode."

[[features]]
id = "FND-02"
tier = "tier_1_foundational"
direction = "ghostty_to_bilterm"
subsystem = "vt_parser"
title = "Mouse Alternate Scroll (DECSET ?1007)"
ghostty_ref = "src/terminal/modes.zig (mouse_alternate_scroll = 1007)"
bilterm_target_files = ["src/vt/mod.rs", "src/input/mod.rs"]
target_milestone = "v0.2.0"
priority = "high"
effort = "small"
summary = "Translate mouse wheel scroll into Up/Down arrow keys when in Alternate Screen (?1049) without mouse tracking enabled (e.g. less, man, git log)."

[[features]]
id = "FND-03"
tier = "tier_1_foundational"
direction = "ghostty_to_bilterm"
subsystem = "vt_parser"
title = "DECRPM (CSI ? Pd $ p) Mode State Query Reporting"
