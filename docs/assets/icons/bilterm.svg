<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182238"/>
      <stop offset="50%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <radialGradient id="crtScreen" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#001a66"/>
      <stop offset="65%" stop-color="#000048"/>
      <stop offset="100%" stop-color="#040711"/>
    </radialGradient>
    <linearGradient id="promptBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05161e"/>
      <stop offset="100%" stop-color="#020b10"/>
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowAmber" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="scanlines" width="1024" height="8" patternUnits="userSpaceOnUse">
      <rect width="1024" height="4" fill="#000000" fill-opacity="0.28"/>
    </pattern>
  </defs>

  <!-- macOS / Cross-Platform Squircle Outer Chassis -->
  <rect x="44" y="44" width="936" height="936" rx="210" fill="url(#bezelGrad)" stroke="#2e4268" stroke-width="10"/>

  <!-- Inner CRT Glass Screen -->
  <rect x="84" y="84" width="856" height="856" rx="175" fill="url(#crtScreen)"/>

  <!-- Borland Turbo Vision Double-Line Outer Frame -->
  <rect x="126" y="126" width="772" height="772" rx="120" fill="none" stroke="#00ffff" stroke-width="10" stroke-opacity="0.9"/>
  <rect x="146" y="146" width="732" height="732" rx="104" fill="none" stroke="#00ffff" stroke-width="5" stroke-opacity="0.75"/>

  <!-- IBM 3270 Crosshair Reticle (Top-Right Accent) -->
  <g stroke="#ffb000" stroke-opacity="0.75" stroke-width="5" fill="none">
    <circle cx="776" cy="242" r="56"/>
    <circle cx="776" cy="242" r="22" stroke-opacity="0.45"/>
    <line x1="696" y1="242" x2="746" y2="242"/>
    <line x1="806" y1="242" x2="856" y2="242"/>
    <line x1="776" y1="162" x2="776" y2="212"/>
    <line x1="776" y1="272" x2="776" y2="322"/>
  </g>

  <!-- Top Window Badge: [1] BIL;*TERM -->
  <rect x="208" y="110" width="260" height="42" rx="10" fill="#000084" stroke="#00ffff" stroke-width="4"/>
  <text x="338" y="139" text-anchor="middle" font-family="'SF Mono','Menlo','Cascadia Mono',monospace" font-weight="900" font-size="26" fill="#ffff55">[1] 3270×TV</text>

  <!-- Primary Signature Motif: "bil;*" -->
  <g filter="url(#glowGreen)">
    <text x="190" y="485" font-family="'SF Mono','Menlo','JetBrains Mono','Cascadia Mono',monospace" font-weight="900" font-size="228" letter-spacing="-6" fill="#33ff55">bil</text>
  </g>
  <g filter="url(#glowAmber)">
    <text x="582" y="485" font-family="'SF Mono','Menlo','JetBrains Mono','Cascadia Mono',monospace" font-weight="900" font-size="236" letter-spacing="-4" fill="#ffb000">;*</text>
  </g>

  <!-- Floating Composite Command Prompt Box ("==> term█") with Drop Shadow -->
  <rect x="204" y="566" width="654" height="224" rx="22" fill="#000000" fill-opacity="0.65"/>
  <rect x="180" y="542" width="654" height="224" rx="22" fill="url(#promptBg)" stroke="#ffff55" stroke-width="8"/>
  <rect x="194" y="556" width="626" height="196" rx="14" fill="none" stroke="#ffb000" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Prompt Chevron + "term" + Glowing Block Cursor -->
  <text x="224" y="688" font-family="'SF Mono','Menlo','JetBrains Mono','Cascadia Mono',monospace" font-weight="900" font-size="96" fill="#00ffff">==&gt;</text>
  <text x="424" y="688" font-family="'SF Mono','Menlo','JetBrains Mono','Cascadia Mono',monospace" font-weight="900" font-size="116" fill="#ffffff" filter="url(#glowGreen)">term</text>
  <rect x="720" y="598" width="54" height="106" rx="6" fill="#33ff55" filter="url(#glowGreen)"/>

  <!-- Bottom 3270 OIA Status Pill -->
  <text x="512" y="838" text-anchor="middle" font-family="'SF Mono','Menlo','Cascadia Mono',monospace" font-weight="700" font-size="26" fill="#55ffff" fill-opacity="0.88">3270-OIA │ ● READY │ PIN:TOP</text>

  <!-- CRT Scanline Overlay -->
  <rect x="84" y="84" width="856" height="856" rx="175" fill="url(#scanlines)" pointer-events="none"/>
</svg>
