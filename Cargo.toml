[package]
name = "bilterm"
version = "2.1.2"
edition = "2024"
rust-version = "1.88"
description = "IBM 3270 & Borland Turbo Vision inspired TUI multiplexer and composite-pane shell wrapper"
license = "Apache-2.0"

[features]
default = []
# EXPERIMENTAL (opt-in): needs Rust 1.90+ (libghostty-vt MSRV) and Zig 0.15.2 on PATH; the build script
# git-clones Ghostty and builds it with `zig build` (network access required). E.g. `cargo +1.90 test --features ghostty-vt`.
# Enables the libghostty-vt FFI backend in `src/vt/ghostty_backend.rs`. See .planning/reviews/ARCHITECTURE_REVIEW_PLAN.md P0.3.
ghostty-vt = ["dep:libghostty-vt"]
# Enables the native GPU/GUI windowing surface renderer (`GuiWorkspaceRenderer`)
gui = []

[dependencies]
libghostty-vt = { version = "0.2.2", optional = true }
ratatui = "0.30.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
portable-pty = "0.9.0"
vt100-ctt = { version = "0.17.1", default-features = false }
tokio = { version = "1.44.0", features = ["full"] }
futures = "0.3.31"
libc = "0.2.170"
color-eyre = "0.6.3"
thiserror = "2.0.12"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-appender = "0.2.3"
unicode-width = "0.2.0"
serde = { version = "1.0.219", features = ["derive"] }
toml = "0.8.20"
nucleo-matcher = "0.3.1"

[dev-dependencies]
insta = "1.42.2"
tempfile = "3.19.1"
