# Starter Pack 01: 4-Pane Multi-Agent Coding Swarm
# Launch: bilterm --gui -c starter-packs/01-multi-agent-swarm/config.toml --gui-font "JetBrains Mono" --gui-font-size 15

theme = "CyberpunkNeon"
glyph_tier = "UnicodeBox"
window_outline = "Double"
shadow_style = "Translucent"
drop_shadows = true
show_top_menubar = true
show_dos_fkey_bar = true
crosshair_cursor = true
crosshair_fullscreen = false
crt_scanlines = false
font_family = "JetBrains Mono"
font_size_pt = 15
font_scale_pct = 100
leader_key = "Ctrl+X"
history_session = "multi-agent-swarm"
triggers = ["ERROR", "PANIC", "FAILED", "SECURED", "PASS"]

[keybindings]
"Alt+1" = ":focus 1"
"Alt+2" = ":focus 2"
"Alt+3" = ":focus 3"
"Alt+4" = ":focus 4"
"Alt+D" = ":drawer toggle"
"Ctrl+P" = ":palette"
