# Starter Pack 04: Sysadmin 3-Way Incident War Room (with Per-Pane Font Scaling)
# Launch: bilterm --gui -c starter-packs/04-sysadmin-incident-war-room/config.toml --gui-font "JetBrains Mono" --gui-font-size 16

theme = "Ibm3279Amber"
glyph_tier = "UnicodeBox"
window_outline = "Double"
shadow_style = "Checker"
drop_shadows = true
show_top_menubar = true
show_dos_fkey_bar = true
crosshair_cursor = true
crt_scanlines = true
font_family = "JetBrains Mono"
font_size_pt = 16
font_scale_pct = 100
leader_key = "Ctrl+X"
history_session = "incident-war-room"
triggers = ["OOM", "CRITICAL", "DEADLOCK", "PANIC"]
