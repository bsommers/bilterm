# IBM 3278 Phosphor Green Mainframe CRT Workstation
# Launch: bilterm --gui -c starter-packs/05-retro-crt-workstation/ibm-3278-green.toml
theme = "Ibm3278Green"
glyph_tier = "UnicodeBox"
window_outline = "Double"
shadow_style = "Checker"
drop_shadows = true
show_top_menubar = true
show_dos_fkey_bar = true
crosshair_cursor = true
crosshair_fullscreen = true
crt_scanlines = true
font_family = "IBM Plex Mono"
font_size_pt = 15
font_scale_pct = 100
leader_key = "Ctrl+X"
