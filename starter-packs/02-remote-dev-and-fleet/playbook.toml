name = "remote-dev-and-ssh-fleet"

[[steps]]
action = "colon"
command = ":drawer open"

[[steps]]
action = "colon"
command = ":vsplit"

[[steps]]
action = "colon"
command = ":split"

[[steps]]
action = "colon"
command = ":remote add api-east deploy@api-us-east-1.internal:2222 @prod,@api"

[[steps]]
action = "colon"
command = ":remote add db-east deploy@db-us-east-1.internal:2222 @prod,@db"

[[steps]]
action = "feed_output"
pane_id = 2
data = "\u001b]133;C\u0007[api-us-east-1] Connected via SSH + tmux -CC. Status: READY\r\n\u001b]133;D;0\u0007"

[[steps]]
action = "feed_output"
pane_id = 3
data = "\u001b]133;C\u0007[db-us-east-1] Connected via SSH + tmux -CC. PostgreSQL Replication: READY\r\n\u001b]133;D;0\u0007"

[[steps]]
action = "assert_screen_contains"
pane_id = 2
expected = "api-us-east-1"

[[steps]]
action = "assert_screen_contains"
pane_id = 3
expected = "db-us-east-1"
